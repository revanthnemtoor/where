[package]
name = "where_cmd"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "where"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
clap_complete = "4.6.8"
colored = "3.1.1"
csv = "1.4.0"
directories = "6.0.0"
hex = "0.4.3"
libc = "0.2.189"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_derive = "1.0.229"
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
strsim = "0.11.1"
toml = "1.1.4"
wait-timeout = "0.2.1"

[dev-dependencies]
tempfile = "3.27.0"
