[package]
name = "where_cmd"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "where"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
colored = "3.1.1"
hex = "0.4.3"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
